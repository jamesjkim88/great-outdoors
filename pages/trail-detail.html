<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trail Detail</title>
    <link rel="stylesheet" href="../styles/framework.css" />
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body>
    <!-- NAVIGATION BAR -->
    <nav class="navbar">
      <div class="container navbar-container">
        <a href="../index.html" class="navbar-brand">
          <span class="logo-emoji">🏔️</span>
          <div>
            <div class="brand-name">The Great Outdoors</div>
            <div class="brand-subtitle text-xs">Pacific Northwest Hiking</div>
          </div>
        </a>

        <button
          class="navbar-toggle"
          id="navToggle"
          aria-label="Toggle navigation"
        >
          ☰
        </button>

        <ul class="navbar-nav" id="navMenu">
          <li><a href="../index.html" class="nav-link">Home</a></li>
          <li><a href="trails.html" class="nav-link">Trails</a></li>
          <li><a href="safety.html" class="nav-link">Safety</a></li>
          <li>
            <a href="./pages/community.html" class="nav-link">Community</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- This is the container for the trails' details. 
     Content is injected via trails-details.js -->
    <div id="trailContent">
      <!-- Loading message -->
      <div class="container text-center" style="padding: 4rem 0">
        <div class="loading" style="margin: 0 auto 1rem"></div>
        <p>Loading trail information...</p>
      </div>
    </div>
  </body>
  <script src="../scripts/trails-details.js"></script>
  <script src="../scripts/trails-data.js"></script>
  <script src="../scripts/main.js"></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"
    integrity="sha512-MpDFIChbcXl2QgipQrt1VcPHMldRILetapBl5MPCA9Y8r7qvlwx1/Mc9hNTzY+kS5kX6PdoDq41ws1HiVNLdZA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  >
  </script>
  <script>
    document.addEventListener("trailContentReady", () => {
      document.getElementById("printBtn").addEventListener("click", () => {
        window.scrollTo(0, 0);
        const element = document.getElementById("trailContent");

        const options = {
          margin: 10,
          filename: trailId,
          image: { type: "jpeg", quality: 0.98 },
          html2canvas: {
            scale: 3,
            scrollY: 0
          },
          jsPDF: { unit: "pt", format: "b4", orientation: "landscape" }
        };

        html2pdf().set(options).from(element).save();
      });
    });
  </script>
</html>
